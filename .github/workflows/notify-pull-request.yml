name: Send Message on Pull Request open.
permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types: [opened, reopened]

jobs:
  sendMessage:
    runs-on: ubuntu-latest

    steps:
      - name: send discord message
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{
                 "content": "**New Pull Request**\n**Author:** ${{ github.event.pull_request.user.login }}\n**Title:** ${{ github.event.pull_request.title }}\n**Link:** ${{ github.event.pull_request.html_url }}"
               }' \
               ${{ secrets.DISCORD_WEBHOOK }}
