name: Send Message on discussions comment.
permissions:
  contents: read
  pull-requests: write

on:
  discussion_comment:
    types: [created]

jobs:
  sendMessage:
    runs-on: ubuntu-latest

    steps:
      - name: send discord message
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          COMMENT_BODY=$(echo '${{ github.event.comment.body }}' | head -c 500 | sed 's/\\/\\\\/g' | sed 's/"/\\"/g')
          DISCUSSION_TITLE=$(echo '${{ github.event.discussion.title }}' | sed 's/\\/\\\\/g' | sed 's/"/\\"/g')
          
          curl -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"💬 New Discussion Comment\",
                \"description\": \"Someone commented on a discussion\",
                \"color\": 3447003,
                \"fields\": [
                  {
                    \"name\": \"Discussion\",
                    \"value\": \"${DISCUSSION_TITLE}\",
                    \"inline\": false
                  },
                  {
                    \"name\": \"Author\",
                    \"value\": \"${{ github.event.sender.login }}\",
                    \"inline\": true
                  },
                  {
                    \"name\": \"Comment\",
                    \"value\": \"${COMMENT_BODY}\",
                    \"inline\": false
                  }
                ],
                \"url\": \"${{ github.event.comment.html_url }}\",
                \"thumbnail\": {
                  \"url\": \"${{ github.event.sender.avatar_url }}\"
                },
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)\"
              }]
            }" \
            "${DISCORD_WEBHOOK}"