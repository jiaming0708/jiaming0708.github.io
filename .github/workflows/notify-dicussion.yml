name: Send Message on discussions comment.
permissions:
  contents: read
  pull-requests: write

on:
  discussion_comment:
    types: [created]

jobs:
  sendMessage:
    runs-on: ubuntu-latest

    steps:
      - name: send discord message
        run: |
          # Clean and truncate comment body
          BODY=$(echo '${{ github.event.comment.body }}' | head -c 1000 | tr -d '"' | tr -d '\\')
          TITLE=$(echo '${{ github.event.discussion.title }}' | tr -d '"' | tr -d '\\')
          
          # Create JSON payload using heredoc
          cat << EOF > payload.json
          {
            "embeds": [{
              "title": "💬 New Discussion Comment",
              "description": "Someone commented on a discussion",
              "color": 3447003,
              "fields": [
                {"name": "Discussion", "value": "${TITLE}", "inline": false},
                {"name": "Author", "value": "${{ github.event.sender.login }}", "inline": true},
                {"name": "Comment", "value": "${BODY}", "inline": false}
              ],
              "url": "${{ github.event.comment.html_url }}",
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)",
              "thumbnail": {
                "url": "${{ github.event.sender.avatar_url }}"
              }
            }]
          }
          EOF
          
          curl -H "Content-Type: application/json" \
               -X POST \
               -d @payload.json \
               "${{ secrets.DISCORD_WEBHOOK }}"