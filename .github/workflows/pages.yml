name: Pages
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - source  # default branch

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      # install node
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'
          cache-dependency-path: '**/yarn.lock'

      # install dependencies
      - name: Install Dependencies
        run: yarn install
      # build
      - name: Build
        run: yarn build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to Github Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify Discord
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            COLOR="65280"
            EMOJI="✅"
          else
            COLOR="16711680"
            EMOJI="❌"
          fi
          
          # Create JSON payload using heredoc to avoid escaping issues
          cat << EOF > payload.json
          {
            "embeds": [{
              "title": "${EMOJI} Deployment ${STATUS}",
              "description": "${{ github.repository }} has new deployment",
              "color": ${COLOR},
              "fields": [
                {"name": "Status", "value": "${{ job.status }}", "inline": true},
                {"name": "Branch", "value": "${{ github.ref_name }}", "inline": true},
                {"name": "Author", "value": "${{ github.actor }}", "inline": true},
                {"name": "Commit", "value": "[\`${{ github.sha }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})", "inline": false}
              ],
              "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
            }]
          }
          EOF
          
          curl -H "Content-Type: application/json" \
               -X POST \
               -d @payload.json \
               "${{ secrets.DISCORD_WEBHOOK }}"