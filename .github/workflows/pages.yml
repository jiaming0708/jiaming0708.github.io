name: Pages
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - source  # default branch

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      # install node
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '25.x'
          cache: 'yarn'
          cache-dependency-path: '**/yarn.lock'

      # install dependencies
      - name: Install Dependencies
        run: yarn install
      # build
      - name: Build
        run: yarn build
      
      # Copy markdown source files for agent access
      - name: Copy Markdown Sources
        run: |
          echo "Copying markdown source files for Markdown for Agents support..."
          
          # Create markdown directory in public
          mkdir -p public/_markdown
          
          # Copy all markdown posts preserving structure
          find source/_posts -name "*.md" -type f | while read file; do
            # Extract filename without path
            filename=$(basename "$file")
            # Extract year, month, day, title from filename (format: YYYY-MM-DD-title.md)
            if [[ $filename =~ ^([0-9]{4})-([0-9]{2})-([0-9]{2})-(.+)\.md$ ]]; then
              year="${BASH_REMATCH[1]}"
              month="${BASH_REMATCH[2]}"
              day="${BASH_REMATCH[3]}"
              title="${BASH_REMATCH[4]}"
              
              # Create destination directory
              dest_dir="public/${year}/${month}/${day}/${title}"
              mkdir -p "$dest_dir"
              
              # Copy markdown file
              cp "$file" "$dest_dir/index.md"
              echo "Copied: $file -> $dest_dir/index.md"
            fi
          done
          
          echo "Markdown source files copied successfully!"
      
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to Github Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            COLOR="65280"
            EMOJI="✅"
          else
            COLOR="16711680"
            EMOJI="❌"
          fi
          
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_SHORT="${COMMIT_SHA:0:7}"
          
          curl -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"${EMOJI} Deployment ${STATUS}\",
                \"description\": \"**${{ github.repository }}** has new deployment\",
                \"color\": ${COLOR},
                \"fields\": [
                  {
                    \"name\": \"Status\",
                    \"value\": \"${{ job.status }}\",
                    \"inline\": true
                  },
                  {
                    \"name\": \"Branch\",
                    \"value\": \"${{ github.ref_name }}\",
                    \"inline\": true
                  },
                  {
                    \"name\": \"Author\",
                    \"value\": \"${{ github.actor }}\",
                    \"inline\": true
                  },
                  {
                    \"name\": \"Commit\",
                    \"value\": \"[${COMMIT_SHORT}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})\",
                    \"inline\": false
                  }
                ],
                \"url\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)\"
              }]
            }" \
            "${DISCORD_WEBHOOK}"